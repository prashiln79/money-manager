<div class="categories-page-wrapper w-full">
  @if (breakpointService.isDesktopLayout()) {
    @if (vm$ | async; as vm) {
      <app-category-desktop
        [vm]="vm"
        [errorMessage]="errorMessage"
        [selectedtabGroup]="selectedtabGroup()"
        [searchControl]="searchControl"
        [filterType]="(filterType$ | async) || 'all'"
        [selectedCategoryId]="selectedCategoryId"
        [isAutoCategorizing]="isAutoCategorizing"
        [getSubCategoriesForCategory]="getSubCategoriesForCategory.bind(this)"
        (clearError)="clearError()"
        (openAddMobileDialog)="openAddMobileDialog()"
        (selectedtabGroupChange)="selectedtabGroup.set($event)"
        (setFilterType)="setFilterType($event)"
        (toggleExpandCategory)="toggleExpandCategory($event.category, $event.event)"
        (openMobileDialog)="openMobileDialog($event)"
        (openBudgetDialog)="openBudgetDialog($event)"
        (removeBudget)="removeBudget($event)"
        (removeFromParentCategory)="removeFromParentCategory($event)"
        (deleteCategory)="deleteCategory($event)"
        (autoCategorize)="autoCategorize()"
        (openEditCategoryGroupDialog)="openEditCategoryGroupDialog($event)">
      </app-category-desktop>
    }
  } @else {
    <app-category-mobile [c]="this"></app-category-mobile>
  }
</div>
