<div class="accounts-page fade-in dark:bg-slate-950 w-full">
  @if (breakpointService.isDesktopLayout()) {
    <app-accounts-desktop
      [errorMessage]="errorMessage"
      [bankBalance]="bankBalance$ | async"
      [cashBalance]="cashBalance$ | async"
      [creditBalance]="creditBalance$ | async"
      [investmentBalance]="investmentBalance$ | async"
      [groupedAccountsViewModel]="groupedAccountsViewModel"
      [transactions]="transactions"
      [accountsLength]="(accounts$ | async)?.length || 0"
      [expandedAccount]="expandedAccount"
      (addAccount)="addAccount()"
      (clearError)="clearError()"
      (toggleGroupCollapse)="toggleGroupCollapse($event)"
      (toggleAccountExpansion)="toggleAccountExpansion($event)"
      (viewAccountStatement)="viewAccountStatement($event)"
      (editAccount)="editAccount($event)"
      (deleteAccount)="deleteAccount($event)">
    </app-accounts-desktop>
  } @else {
    <app-accounts-mobile [c]="this"></app-accounts-mobile>
  }
</div>
