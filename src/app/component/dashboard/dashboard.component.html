@if (breakpointService.isDesktopLayout()) {
  <app-desktop-layout
    [updateAvailable]="updateAvailable"
    (refreshApp)="refreshApp()"
    (dismissUpdate)="dismissUpdate()">
    <router-outlet></router-outlet>
  </app-desktop-layout>
} @else {
  <app-mobile-layout
    [updateAvailable]="updateAvailable"
    (refreshApp)="refreshApp()"
    (dismissUpdate)="dismissUpdate()">
    <router-outlet></router-outlet>
  </app-mobile-layout>
}
